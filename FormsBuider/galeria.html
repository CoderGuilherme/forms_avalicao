<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Formulários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./styles/galeria.css">
</head>
<body>

    <header class="main-header">
        <div class="header-brand">
            <img src="./imagem/logo_azul.svg" alt="Logo" class="logo">
            <h1>Galeria de Formulários</h1>
        </div>
        <div class="header-actions">
            <input type="search" id="search-input" placeholder="Pesquisar formulários...">
            <a href="configurador.html" class="btn-new-form">Novo Formulário</a>
        </div>
    </header>

    <div class="gallery-body">
        <aside id="filter-panel">
            <h2>Filtros</h2>
            <div class="filter-group">
                <label for="squad-filter">
                    <i class="fa-solid fa-people-group"></i>
                    <span>Squad</span>
                </label>
                <select id="squad-filter">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="rt-filter">
                    <i class="fa-solid fa-building"></i>
                    <span>RT</span>
                </label>
                <select id="rt-filter">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="type-filter">
                    <i class="fa-solid fa-pager"></i>
                    <span>Tipo de Formulário</span>
                </label>
                <select id="type-filter">
                    <option value="">Todos</option>
                    <option value="Likert">Likert</option>
                    <option value="NPS(0-5)">NPS (0-5)</option>
                    <option value="NPS(0-10)">NPS (0-10)</option>
                    <option value="Backlog">Backlog</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="date-filter">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Criado Após</span>
                </label>
                <input type="date" id="date-filter">
            </div>
            <div class="filter-actions">
                <button id="clear-filters">Limpar Filtros</button>
            </div>
        </aside>

        <main id="gallery-main">
            <div id="initial-prompt">
                <p>Carregando formulários... Se nada aparecer, verifique o console de erros (F12).</p>
            </div>
            <div id="gallery-grid" class="hidden">
                </div>
        </main>
    </div>

    <script src="./scripts/galeria.js"></script>
</body>
</html>
